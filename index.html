<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부 강화하기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">Power UP 버튼을 눌러<br>부를 키워주세요!</h1>
        
        <div class="time-settings">
            <h3>시간 제한 설정</h3>
            <div class="time-buttons">
                <button class="time-btn" data-time="30">30초</button>
                <button class="time-btn" data-time="60">1분</button>
                <button class="time-btn" data-time="90">1분 30초</button>
                <button class="time-btn" data-time="120">2분</button>
                <button class="time-btn" data-time="150">2분 30초</button>
                <button class="time-btn" data-time="180">3분</button>
            </div>
            <button id="startButton" class="start-button">게임 시작</button>
        </div>
        
        <div class="game-area" id="gameArea" style="display: none;">
            <div class="timer-display">
                <h3 id="timerText">남은 시간: 0:00</h3>
            </div>
            
            <div class="level-display">
                <h2 id="levelText">LEVEL 1</h2>
            </div>
            
            <div class="character-display">
                <canvas id="characterCanvas"></canvas>
                <canvas id="particleCanvas"></canvas>
                <div id="levelUpEffect" class="level-up-effect">LEVEL UP!</div>
                <div id="clickEffect" class="click-effect">+1</div>
            </div>
            
            <div class="button-container">
                <img src="shout.png" class="shout-icon shout-left" alt="shout">
                <button id="upgradeButton" class="upgrade-button">
                    <span>Power UP 🔥</span>
                </button>
                <img src="shout.png" class="shout-icon shout-right" alt="shout">
            </div>
            
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
                <span id="progressText" class="progress-text">0 / 3</span>
            </div>
            
            <button id="resetButton" class="reset-button">다시 시작</button>
        </div>
        
        <div class="game-over" id="gameOver" style="display: none;">
            <h2>게임 종료!</h2>
            <p id="finalLevel">최종 레벨: 1</p>
            <button id="restartButton" class="restart-button">다시 도전하기</button>
        </div>
    </div>
    
    <!-- 10레벨 달성 이펙트 (전체 화면) -->
    <div id="milestoneEffect" class="milestone-effect">
        <div class="milestone-content">
            <div class="milestone-text">LEVEL 10 달성!</div>
            <div class="milestone-stars">✨ ⭐ ✨</div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
